<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Cuenta - SIREB VIPI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Metimos FontAwesome para quitar los emojis y que se vea más pro -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-light">
  <!-- Contenedor principal. Pendiente no meterle más padding que en móvil se achiquita mucho -->
  <div class="container py-5">
    <div class="card shadow-sm border-0 mx-auto" style="max-width: 600px;">
      <div class="card-header text-white text-center py-3" style="background-color: #003366;">
        <h4 class="mb-0">Portal del Estudiante</h4>
      </div>
      <div class="card-body p-4 p-md-5 text-center">
        <h5 class="text-muted mb-4">Usuario Conectado: <br><span id="correoUsuario" class="fw-bold text-dark"><?!= correo ?></span></h5>
        
        <h3 class="mb-3" style="color: #003366;">Estatus Administrativo</h3>
        
        <div id="estatusEstudiante" class="mb-4">
          <div class="spinner-border text-primary spinner-border-sm" role="status"></div> Cargando información...
        </div>

        <p id="textoExplicativo" class="lead mb-4 text-secondary" style="display: none;">Genera tu constancia de solvencia oficial en PDF para trámites de grado.</p>
        
        <!-- Botón principal. Escondido por defecto por seguridad -->
        <button id="btnGenerarPDF" class="btn btn-lg px-4 py-3 fw-bold shadow-sm w-100 mb-4" style="background-color: #f39200; border: none; color: white; display: none;" onclick="solicitarSolvencia()">
          <i class="fa-solid fa-file-pdf me-2"></i> Generar Solvencia de Biblioteca
        </button>
        
        <div id="resultadoSolvencia"></div>

        <div id="seccionPrestamosCompleta" style="display: none;">
          <hr class="my-4">
          <div class="text-start">
            <h5 style="color: #003366; font-weight: bold;">Tus Préstamos Activos / Pendientes</h5>
            <div id="listaPrestamos" class="mt-3">
               <p class="text-muted text-center"><small>Cargando inventario...</small></p>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    // Dispara la búsqueda apenas carga la página
    document.addEventListener("DOMContentLoaded", function() {
      const correo = document.getElementById("correoUsuario").innerText;
      // Validamos que el correo sea de verdad y no el template tag roto
      if(correo && !correo.includes("!=")) { 
        google.script.run
          .withSuccessHandler(mostrarDatosEstudiante)
          .obtenerDatosYPrestamos(correo); 
      }
    });

    // Pinta toda la interfaz dependiendo de lo que mande el Backend
    function mostrarDatosEstudiante(datos) {
      const divEstatus = document.getElementById("estatusEstudiante");
      const divPrestamos = document.getElementById("listaPrestamos");
      
      // Agarramos los elementos del DOM (antes lo teniamos regado y daba problemas)
      const btnGenerarPDF = document.getElementById("btnGenerarPDF");
      const textoExplicativo = document.getElementById("textoExplicativo");
      const seccionPrestamosCompleta = document.getElementById("seccionPrestamosCompleta");

      if(!datos) {
        divEstatus.innerHTML = `<span class="badge bg-secondary fs-5"><i class="fa-solid fa-circle-question"></i> No Registrado</span>`;
        divPrestamos.innerHTML = `<div class="alert alert-secondary">No se encontraron datos asociados a este correo. Habla con la Licenciada Johana.</div>`;
        seccionPrestamosCompleta.style.display = "block"; // Forzamos mostrar la caja para que vea el error
        return;
      }

      // --- AQUÍ EMPIEZA LA MAGIA DE LOS PERMISOS ---
      if(datos.estatusSancion === "Solvente") {
        
        // 1. Está limpio, le soltamos el botón
        divEstatus.innerHTML = `<span class="badge bg-success fs-5 px-4 py-2"><i class="fa-solid fa-circle-check"></i> Solvente</span>`;
        
        btnGenerarPDF.style.display = "block";
        textoExplicativo.style.display = "block";
        seccionPrestamosCompleta.style.display = "none";
        
      } else {
        
        // 2. Debe libros o está castigado
        // Le escondemos el botón del PDF para que pague primero jaja
        btnGenerarPDF.style.display = "none";
        textoExplicativo.style.display = "none";
        seccionPrestamosCompleta.style.display = "block";

        if(datos.estatusSancion === "Inhabilitado") {
          divEstatus.innerHTML = `<span class="badge bg-danger fs-5 px-4 py-2"><i class="fa-solid fa-circle-xmark"></i> Inhabilitado (Multa Activa)</span><br><small class="text-danger mt-2 d-block fw-bold">No puedes generar solvencias hasta regularizar tu situación.</small>`;
        } else {
          divEstatus.innerHTML = `<span class="badge bg-warning text-dark fs-5 px-4 py-2"><i class="fa-solid fa-book-bookmark"></i> ${datos.estatusSancion}</span>`;
        }

        // Pintar las tarjetitas de los libros que tiene retenidos
        if(!datos.prestamosActivos || datos.prestamosActivos.length === 0) {
          divPrestamos.innerHTML = `<div class="alert alert-light border text-center">Actualmente no tienes libros físicos pendientes, pero presentas una sanción administrativa. Por favor, acércate a la biblioteca.</div>`;
        } else {
          let htmlPrestamos = "";
          datos.prestamosActivos.forEach(p => {
            htmlPrestamos += `
              <div class="p-3 mb-2 rounded bg-light border-start border-warning border-4 shadow-sm">
                <div class="d-flex justify-content-between align-items-center">
                  <div>
                    <small class="text-muted d-block">ID Recibo: ${p.idPrestamo}</small>
                    <strong>Libro LCC: <span class="text-primary">${p.idLibro}</span></strong>
                  </div>
                  <div class="text-end">
                    <small class="text-muted d-block">Vencimiento</small>
                    <strong class="text-danger">${p.fechaVencimiento}</strong>
                  </div>
                </div>
              </div>`;
          });
          divPrestamos.innerHTML = htmlPrestamos;
        }
      }
    }

    // Llama a Codigo.gs para armar el PDF
    function solicitarSolvencia() {
      const btn = document.getElementById("btnGenerarPDF");
      const contenedorResultado = document.getElementById("resultadoSolvencia");
      const correo = document.getElementById("correoUsuario").innerText;
      
      // Bloqueamos el botón para que los alumnos no le den 20 veces seguidas y saturen la API
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin me-2"></i> Generando documento...`;
      btn.disabled = true;
      contenedorResultado.innerHTML = "";

      google.script.run
        .withSuccessHandler(function(respuesta) {
          if (respuesta.exito) {
            // Truquito para forzar la descarga del PDF en base64 sin abrir otra pestaña
            const link = document.createElement('a');
            link.href = "data:application/pdf;base64," + respuesta.archivoBase64;
            link.download = respuesta.nombreArchivo;
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            contenedorResultado.innerHTML = `<div class="alert alert-success fw-bold"><i class="fa-solid fa-circle-check"></i> ¡Constancia descargada con éxito!</div>`;
          } else {
            contenedorResultado.innerHTML = `<div class="alert alert-danger fw-bold"><i class="fa-solid fa-circle-exclamation"></i> ${respuesta.mensaje}</div>`;
          }
          // Restauramos el botón
          btn.innerHTML = `<i class="fa-solid fa-file-pdf me-2"></i> Generar Solvencia de Biblioteca`;
          btn.disabled = false;
        })
        .withFailureHandler(function(error) {
           contenedorResultado.innerHTML = `<div class="alert alert-danger fw-bold"><i class="fa-solid fa-triangle-exclamation"></i> Error Técnico: ${error.message}</div>`;
           btn.innerHTML = `<i class="fa-solid fa-file-pdf me-2"></i> Generar Solvencia de Biblioteca`;
           btn.disabled = false;
        })
        .generarSolvenciaPDF(correo);
    }
  </script>
</body>
</html>
